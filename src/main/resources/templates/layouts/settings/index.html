<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>

<main>
    <style>
        :root {
            --card-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            --transition: all 0.3s ease-in-out;
        }

        .entity-card {
            transition: var(--transition);
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        .entity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.2);
        }

        .card-icon {
            font-size: 2rem;
            opacity: 0.7;
            transition: var(--transition);
        }

        .entity-card:hover .card-icon {
            transform: scale(1.1);
            opacity: 1;
        }

        .entity-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 0.7rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-card {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .card-delay-1 { animation-delay: 0.1s; }
        .card-delay-2 { animation-delay: 0.2s; }
        .card-delay-3 { animation-delay: 0.3s; }
    </style>
    <script>
        // Add hover effects
        document.querySelectorAll('.entity-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const icon = card.querySelector('.card-icon');
                icon.classList.add('text-white');
            });

            card.addEventListener('mouseleave', () => {
                const icon = card.querySelector('.card-icon');
                icon.classList.remove('text-white');
            });
        });
    </script>
    <h1 class="mt-3">General Settings</h1>
    <hr/>
    <div class="card">
        <div class="card-header">
            <h5>Select Entity to Manage</h5>
        </div>
        <div class="card-body">

            <div class="row">
                <th:block th:each="entity, iterStat : ${entities}">
                    <div class="col-lg-4 col-md-6">
                        <div th:classappend="'animate-card card-delay-' + ${iterStat.index % 3}"
                             class="entity-card card border-start-lg"
                             th:attr="data-entity=${entity.name}">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <h5 class="card-title mb-1" th:text="${entity.displayName}">
                                            Entity Name
                                        </h5>
                                        <p class="text-muted mb-2 small">
                                            <span th:text="${entity.fields.size()}">0</span> configurable fields
                                        </p>
                                        <a th:href="@{/settings/{entityName}(entityName=${entity.name})}"
                                           class="btn btn-sm btn-outline-primary">
                                            Manage <i class="bi bi-arrow-right ms-1"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>



</main>
</body>

</html>
