<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>

<main>
    <style>
        .wrap-table{
            font-size: smaller;
        }
        tr {
            transition: background-color 0.3s ease;
        }

        tr.highlighted {
            --bs-table-bg: #d0f3f7 !important;
        }
        .showDetailMessage {
          display: none;
        }
        #showDetailMessage:checked ~ .showDetailMessage {
          display: block;
        }
        .wrap-table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
            /* Optional: set a max-width to force wrapping */
            max-width: 200px;
          }
    </style>
    <script>

    </script>
    <h1 class="mt-3" th:text="${metadata.displayName} + ' Management'">Entity Management</h1>
    <hr/>
    <!-- Success/Error Messages -->
<!--    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">-->
<!--        <ul>-->
<!--            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>-->
<!--        </ul>-->
<!--    </div>-->
    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>


    <!-- Dynamic Form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 th:text="(${entity.id} != null ? 'Edit' : 'New') + ' ' + ${metadata.displayName}"></h5>
        </div>
        <div class="card-body">
            <form th:action="@{/settings/{entityName}/save(entityName=${metadata.name})}" class="form-horizontal" method="post">
                <input type="hidden" name="id" th:value="${entity.id}"/>
                <div class="row">
                    <div th:each="field : ${metadata.fields}" class="col-md-4 mb-3">
                        <label th:for="${field.name}" class="form-label" th:text="${field.displayName}"></label>

                        <input th:if="${field.type.simpleName == 'String'}"
                               type="text" class="form-control"
                               th:id="${field.name}" th:name="${field.name}"
                               th:value="${entity.__${field.name}__}"
                               th:required="${field.required}">

                        <input th:if="${field.type.simpleName == 'Long' || field.type.simpleName == 'Integer'}"
                               type="number" class="form-control"
                               th:id="${field.name}" th:name="${field.name}"
                               th:value="${entity.__${field.name}__}"
                               th:required="${field.required}">

                        <!-- Add more field types as needed -->

                    </div>

                </div>

                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/settings" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to General Settings
                </a>
            </form>
        </div>
    </div>

    <!-- Dynamic Table -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 th:text="${metadata.displayName} + ' List'"></h5>
            <div>
                <a th:href="@{/settings/{entityName}(entityName=${metadata.name})}"
                   class="btn btn-sm btn-success">
                    <i class="bi bi-plus"></i> Add New
                </a>
            </div>
        </div>
        <div class="card-body">
            <div class="row justify-content-center mt-3 mb-3">
                <div class="col-md-12">
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search across all columns...">
                    </div>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-bordered wrap-table">
                    <thead class="table-light">
                    <tr>
                        <th th:each="field : ${metadata.fields}" th:text="${field.displayName}"></th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${entities}">
                        <td th:each="field : ${metadata.fields}">
                            <span th:text="${item.__${field.name}__}"></span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/settings/{entityName}(entityName=${metadata.name}, id=${item.id})}"
                                   class="btn btn-primary">Edit
                                </a>
                                <form th:action="@{/settings/{entityName}/delete(entityName=${metadata.name})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${item.id}">
                                    <button type="submit" class="btn btn-danger"
                                            onclick="return confirm('Are you sure?')">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const tableRows = document.querySelectorAll('tbody tr');
            const noResults = document.getElementById('noResults');

            // Store original content of each cell to restore formatting
            const originalContent = [];
            tableRows.forEach((row, rowIndex) => {
                originalContent[rowIndex] = [];
                const cells = row.querySelectorAll('td');
                cells.forEach((cell, cellIndex) => {
                    originalContent[rowIndex][cellIndex] = cell.innerHTML;
                });
            });

            searchInput.addEventListener('input', function() {
                const searchText = this.value.toLowerCase();
                let resultsFound = false;

                // If search is empty, restore all rows with original content
                if (searchText === '') {
                    tableRows.forEach((row, rowIndex) => {
                        row.style.display = '';
                        const cells = row.querySelectorAll('td');
                        cells.forEach((cell, cellIndex) => {
                            cell.innerHTML = originalContent[rowIndex][cellIndex];
                        });
                    });
                    noResults.style.display = 'none';
                    return;
                }

                tableRows.forEach((row, rowIndex) => {
                    let rowContainsSearch = false;
                    const cells = row.querySelectorAll('td');

                    cells.forEach((cell, cellIndex) => {
                        // Restore original content before searching
                        cell.innerHTML = originalContent[rowIndex][cellIndex];
                        const cellText = cell.textContent.toLowerCase();
                        const index = cellText.indexOf(searchText);

                        // If search text is found in this cell
                        if (index !== -1 && searchText.length > 0) {
                            rowContainsSearch = true;
                            resultsFound = true;

                            // Highlight the matching text without changing original HTML structure
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = originalContent[rowIndex][cellIndex];
                            const textContent = tempDiv.textContent || tempDiv.innerText || '';

                            // Create highlighted version
                            const regex = new RegExp(searchText, 'gi');
                            const highlightedHtml = originalContent[rowIndex][cellIndex].replace(regex,
                                match => `<span class="highlight">${match}</span>`);

                            cell.innerHTML = highlightedHtml;
                        }
                    });

                    // Show or hide the row based on search
                    row.style.display = rowContainsSearch ? '' : 'none';
                });

                // Show no results message if needed
                noResults.style.display = resultsFound ? 'none' : 'block';
            });
        });
    </script>
</main>
</body>

</html>
