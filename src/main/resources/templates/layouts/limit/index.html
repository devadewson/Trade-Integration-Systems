<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>

<main>
    <script>

    </script>
    <h1 class="mt-3">Facility Limit</h1>
    <hr/>
    <div class="card mb-3">
        <h5 class="card-header">CIF Search</h5>
        <div class="card-body">
            <!-- Search Box -->
            <form th:action="@{/limit}" method="get" class="mb-4">
                <div class="mb-3 row">
                    <div class="col-sm-6">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by CIF No">
                    </div>
                </div>
                <div class="mb-3 row">
                    <div class="col-sm-6">
                        <input type="text" name="facility" th:value="${facility}" class="form-control" placeholder="Search in Facility or Reservation">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Search</button>

            </form>
        </div>
    </div>
    <hr/>
    <div class="card mb-3">
        <h5 class="card-header">CIF List</h5>
        <div class="card-body">
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>CIFNo</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${limitPage.content}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.cifno}"></td>
                    <td>
                        <a th:href="@{/limit/detail/{id}(id=${item.id})}" class="btn btn-info btn-sm">View Details</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <!-- Pagination Controls -->
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    <!-- Previous Button -->
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/limit(page=1, size=${limitPage.size}, search=${search}, facility=${facility})}">First</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/limit(page=${currentPage - 1}, size=${limitPage.size}, search=${search}, facility=${facility})}">Previous</a>
                    </li>

                    <!-- "<< Previous 10 Pages" Button (Shows only if not on first 10 pages) -->
                    <li class="page-item" th:if="${currentPage > 10}">
                        <a class="page-link" th:href="@{/limit(page=${(currentPage - 10)}, size=${limitPage.size}, search=${search}, facility=${facility})}"><<</a>
                    </li>

                    <!-- Page Numbers (Limited to current range, e.g., 1-10, 11-20, etc.) -->
                    <li th:each="page : ${#numbers.sequence(T(java.lang.Math).max(1, (currentPage - 5)),T(java.lang.Math).min(currentPage + 4, limitPage.totalPages))}"
                        class="page-item" th:classappend="${page == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/limit(page=${page}, size=${limitPage.size}, search=${search}, facility=${facility})}" th:text="${page}"></a>
                    </li>

                    <!-- ">> Next 10 Pages" Button (Shows only if more pages exist) -->
                    <li class="page-item" th:if="${(currentPage + 10) <= limitPage.totalPages}">
                        <a class="page-link" th:href="@{/limit(page=${(currentPage + 10)}, size=${limitPage.size}, search=${search}, facility=${facility})}">>></a>
                    </li>

                    <!-- Next Button -->
                    <li class="page-item" th:classappend="${currentPage == limitPage.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/limit(page=${currentPage + 1}, size=${limitPage.size}, search=${search}, facility=${facility})}">Next</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == limitPage.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/limit(page=${limitPage.totalPages}, size=${limitPage.size}, search=${search}, facility=${facility})}">Last</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <hr/>

</main>
</body>

</html>
