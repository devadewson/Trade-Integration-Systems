<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>
<main>

    <h1>Parameter Details</h1>

    <div class="card mb-3">
        <h5 class="card-header">Parameter</h5>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <form th:action="@{/parameter/detail/update}" method="post">
                        <input type="hidden" name="ParameterId" th:value="${parameter.id}">
                        <div class="form-group">
                            <label for="prmKey">Parameter Key</label>
                            <input type="text" th:value="${parameter.prmKey}"  class="form-control" id="prmKey" name="prmKey" required>
                        </div>
                        <div class="form-group">
                            <label for="prmValue">Parameter Value</label>
                            <input type="text" th:value="${parameter.prmValue}" class="form-control" id="prmValue" name="prmValue" required>
                        </div>
                        <div class="form-group">
                            <label for="prmValue">Parameter Description</label>
                            <input type="text" th:value="${parameter.prmDesc}" class="form-control" id="prmDesc" name="prmDesc">
                        </div>
                        <div class="mt-3">
                            <a href="/parameter" class="btn btn-secondary">Back to List</a>
                            <button type="submit" class="btn btn-primary">Save changes</button>
                        </div>
                    </form>
                </div>
            </div>
            <hr/>
        </div>
    </div>


</main>
<!-- JavaScript to Handle "View Logs" Button Click -->

</body>

</html>
