<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>

<main>
    <script>

    </script>
    <h1 class="mt-3">Parameter List</h1>
    <hr/>
    <div class="card mb-3">
        <h5 class="card-header">Parameter Search</h5>
        <div class="card-body">
            <!-- Search Box -->
            <form th:action="@{/parameter}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by Parameter Key">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>
        </div>
    </div>
    <hr/>
    <div class="card mb-3">
        <h5 class="card-header">Parameter List</h5>
        <div class="card-body">
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Parameter Code</th>
                    <th>Parameter Value</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="paramItem : ${parameterPage.content}">
                    <td th:text="${paramItem.id}"></td>
                    <td th:text="${paramItem.prmKey}"></td>
                    <td th:text="${paramItem.prmValue}"></td>
                    <td>
                        <a th:href="@{/parameter/detail/{id}(id=${paramItem.id})}" class="btn btn-info btn-sm">View Details</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <!-- Pagination Controls -->
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    <!-- Previous Button -->
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/parameter(page=1, size=${parameterPage.size}, search=${search})}">First</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/parameter(page=${currentPage - 1}, size=${parameterPage.size}, search=${search})}">Previous</a>
                    </li>

                    <!-- "<< Previous 10 Pages" Button (Shows only if not on first 10 pages) -->
                    <li class="page-item" th:if="${currentPage > 10}">
                        <a class="page-link" th:href="@{/parameter(page=${(currentPage - 10)}, size=${parameterPage.size}, search=${search})}"><<</a>
                    </li>

                    <!-- Page Numbers (Limited to current range, e.g., 1-10, 11-20, etc.) -->
                    <li th:each="page : ${#numbers.sequence(T(java.lang.Math).max(1, (currentPage - 5)),T(java.lang.Math).min(currentPage + 4, parameterPage.totalPages))}"
                        class="page-item" th:classappend="${page == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/parameter(page=${page}, size=${parameterPage.size}, search=${search})}" th:text="${page}"></a>
                    </li>

                    <!-- ">> Next 10 Pages" Button (Shows only if more pages exist) -->
                    <li class="page-item" th:if="${(currentPage + 10) <= parameterPage.totalPages}">
                        <a class="page-link" th:href="@{/parameter(page=${(currentPage + 10)}, size=${parameterPage.size}, search=${search})}">>></a>
                    </li>

                    <!-- Next Button -->
                    <li class="page-item" th:classappend="${currentPage == parameterPage.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/parameter(page=${currentPage + 1}, size=${parameterPage.size}, search=${search})}">Next</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == parameterPage.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/parameter(page=${parameterPage.totalPages}, size=${parameterPage.size}, search=${search})}">Last</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <hr/>



</main>
</body>

</html>
