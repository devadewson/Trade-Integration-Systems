<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>

<main>
    <style>

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .construction-icon {
            font-size: 5em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px);}
            60% {transform: translateY(-15px);}
        }
        .progress-container {
            width: 100%;
            background-color: #ffe6eb;
            border-radius: 10px;
            margin: 30px 0;
        }
        .progress-container {
            width: 100%;
            background-color: #ffe6eb;
            border-radius: 10px;
            margin: 30px 0;
            padding: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-message {
            font-size: 1.1em;
            font-weight: bold;
            opacity: 0;
            position: absolute;
            animation: fadeInOut 12s infinite;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            20% { opacity: 1; }
            30% { opacity: 0; }
            100% { opacity: 0; }
        }
        .progress-message:nth-child(1) { animation-delay: 0s; }
        .progress-message:nth-child(2) { animation-delay: 3s; }
        .progress-message:nth-child(3) { animation-delay: 6s; }
        .progress-message:nth-child(4) { animation-delay: 9s; }
        .emoji-row {
            font-size: 2em;
            margin: 20px 0;
            letter-spacing: 15px;
        }
        .emoji-row {
            font-size: 2em;
            margin: 20px 0;
            letter-spacing: 15px;
        }
    </style>
    <div class="container">
        <div class="construction-icon">🚧</div>
        <h1>Under Construction!</h1>
        <p>This site is still in development!</p>

        <div class="progress-container">
            <div class="progress-message">✨ Designing beautiful views...</div>
            <div class="progress-message">⚙️ Building the backend...</div>
            <div class="progress-message">🧪 Testing all the things...</div>
            <div class="progress-message">☕ Taking coffee breaks (important!)</div>
        </div>

        <p>We're working hard to build something amazing for you!</p>

        <div class="emoji-row">
            🐹 🛠️ 🧰 📐 🖌️
        </div>

        <p>Please check back soon!</p>

    </div>



</main>
</body>

</html>
